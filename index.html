<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital SAT Practice Hub</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <style>
        /* Window Opening Intro Animation */
        #intro-splash {
            position: fixed;
            inset: 0;
            background: #090d16;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeOutSplash 0.8s ease-in-out 1.2s forwards;
        }
        .window-pane {
            position: absolute;
            background: #1e293b;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .window-left { top: 0; left: 0; width: 50%; height: 100%; border-right: 2px solid #3b82f6; }
        .window-right { top: 0; right: 0; width: 50%; height: 100%; border-left: 2px solid #3b82f6; }
        
        #intro-splash.active .window-left { transform: translateX(-100%); }
        #intro-splash.active .window-right { transform: translateX(100%); }
        
        @keyframes fadeOutSplash {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Window Opening Splash Animation -->
    <div id="intro-splash">
        <div class="window-pane window-left"></div>
        <div class="window-pane window-right"></div>
        <div class="relative z-10 text-center font-bold text-3xl tracking-wider text-blue-400 animate-pulse">
            SAT PRACTICE HUB
        </div>
    </div>

    <!-- Header with Always-Available Back Button -->
    <header class="w-full max-w-4xl mx-auto p-4 flex justify-between items-center border-b border-slate-800">
        <button id="back-btn" onclick="goToMainScreen()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-lg transition-colors flex items-center gap-1.5 border border-slate-700">
            &larr; Back to Main Hub
        </button>
        <h1 class="text-lg font-bold text-blue-400">Digital SAT Trainer</h1>
        <button onclick="goToMainScreen()" class="text-xs bg-slate-900 px-3 py-1.5 rounded border border-slate-800 hover:border-slate-700">Change Settings</button>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl mx-auto p-6 my-auto">
        <!-- Main Screen -->
        <div id="main-screen" class="space-y-6 text-center">
            <h2 class="text-3xl font-extrabold tracking-tight">Master the Digital SAT</h2>
            <p class="text-slate-400 text-sm">Select your challenge level and generate custom AI practice questions instantly.</p>
            
            <div class="flex justify-center gap-4 pt-4">
                <button onclick="startPractice('Easy')" class="px-5 py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-xl shadow-lg transition-all">Easy Practice</button>
                <button onclick="startPractice('Hard')" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-xl shadow-lg transition-all">Hard Challenge</button>
            </div>
        </div>

        <!-- Practice Screen -->
        <div id="practice-screen" class="hidden space-y-4">
            <div id="loading" class="text-center py-12 text-slate-400 animate-pulse">
                Generating question (Harder questions take a few seconds)...
            </div>
            <div id="question-container" class="hidden space-y-4 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                <!-- Question loaded dynamically -->
            </div>
        </div>
    </main>

    <!-- Developer Footer -->
    <footer class="w-full text-center py-6 text-xs text-slate-500 border-t border-slate-900">
        Developed with precision for Digital SAT Prep &bull; Powered by Gemini
    </footer>

    <script>
        // Trigger window opening animation on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('intro-splash').classList.add('active');
            }, 300);
        });

        function goToMainScreen() {
            document.getElementById('practice-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
        }

        async function startPractice(difficulty) {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('practice-screen').classList.remove('hidden');
            
            const loadingEl = document.getElementById('loading');
            const containerEl = document.getElementById('question-container');
            
            loadingEl.classList.remove('hidden');
            containerEl.classList.add('hidden');

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ difficulty, domain: 'Algebra & Advanced Math' })
                });

                if (!res.ok) throw new Error('Timeout or generation error');
                
                const data = await res.json();
                
                containerEl.innerHTML = `
                    <span class="text-xs uppercase tracking-wider px-2 py-1 bg-blue-950 text-blue-400 rounded">${difficulty} Question</span>
                    <p class="text-base font-medium mt-2">${data.question}</p>
                    <div class="space-y-2 mt-4">
                        ${data.options.map(opt => `<button class="w-full text-left p-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors">${opt}</button>`).join('')}
                    </div>
                `;
                
                loadingEl.classList.add('hidden');
                containerEl.classList.remove('hidden');
            } catch (err) {
                loadingEl.innerHTML = '<span class="text-red-400">Request took too long or failed. Hard questions require extra time—click Back and try again!</span>';
            }
        }
    </script>
</body>
</html>
