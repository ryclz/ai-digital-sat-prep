<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Digital SAT Prep Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .api-config {
            display: flex;
            gap: 0.55rem;
            align-items: center;
        }

        input[type="password"], select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="password"]:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Intro Screen */
        .hero {
            text-align: center;
            padding: 2rem 0;
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }

        .hero p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .config-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .config-group select {
            width: 100%;
            padding: 0.75rem;
        }

        .start-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
        }

        /* Question Screen */
        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .badge {
            background: rgba(79, 70, 229, 0.2);
            color: #818cf8;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(79, 70, 229, 0.4);
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            white-space: pre-wrap;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-align: left;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: var(--success) !important;
            color: #4ade80 !important;
        }

        .option-btn.incorrect {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--error) !important;
            color: #f87171 !important;
        }

        .feedback-box {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: #f87171;
        }

        .feedback-box.success-msg {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: #4ade80;
        }

        .next-btn-container {
            margin-top: 1.5rem;
            text-align: right;
        }

        .loader {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SAT AI Generator</h1>
            <div class="api-config">
                <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key">
                <button onclick="saveApiKey()">Save</button>
            </div>
        </header>

        <!-- SCREEN 1: INTRO / CONFIG -->
        <div id="introScreen" class="screen active">
            <div class="hero">
                <h2>Digital SAT Practice Engine</h2>
                <p>Configure your target parameters below to generate official-style adaptive questions backed by Google Gemini AI.</p>
                
                <div class="config-grid">
                    <div class="config-group">
                        <label for="domainSelect">Subject Domain</label>
                        <select id="domainSelect">
                            <option value="Reading & Writing">Reading & Writing</option>
                            <option value="Math">Math</option>
                        </select>
                    </div>
                    <div class="config-group">
                        <label for="difficultySelect">Target Difficulty</label>
                        <select id="difficultySelect">
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                </div>

                <button class="start-btn" onclick="startPractice()">Generate Practice Question</button>
            </div>
        </div>

        <!-- SCREEN 2: LOADING -->
        <div id="loadingScreen" class="screen">
            <div class="loader">Crafting custom College Board standard question... Please wait.</div>
        </div>

        <!-- SCREEN 3: QUESTION VIEW -->
        <div id="questionScreen" class="screen">
            <div class="meta-bar">
                <span id="topicTag" class="badge">Topic</span>
                <span id="difficultyBadge">Difficulty: --/10</span>
            </div>

            <div id="questionText" class="question-text">Loading question text...</div>

            <div id="optionsList" class="options-list">
                <!-- Options injected via JS -->
            </div>

            <div id="feedbackBox" class="feedback-box"></div>

            <div class="next-btn-container">
                <button id="nextBtn" style="display:none;" onclick="startPractice()">Next Question &rarr;</button>
            </div>
        </div>
    </div>

    <script>
        let currentQuestionData = null;

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key saved successfully!');
            } else {
                alert('Please enter a valid key.');
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function fetchWithModel(modelName, apiKey, prompt) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: controller.signal,
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                clearTimeout(timeoutId);
                return response;
            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        async function startPractice() {
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('Please enter and save your Google Gemini API key first!');
                return;
            }

            const domain = document.getElementById('domainSelect').value;
            const difficulty = document.getElementById('difficultySelect').value;

            switchScreen('loadingScreen');

            const prompt = `You are an expert test creator for the College Board Digital SAT. Generate a single, highly rigorous ${difficulty} level multiple-choice question for ${domain}.
            
            Return ONLY a raw JSON object with no markdown wrappers, no backticks, matching this exact structure:
            {
              "topic": "Use official SAT taxonomy (e.g., Information and Ideas, Craft and Structure, Standard English Conventions for English; or Algebra, Advanced Math, Problem-Solving and Data Analysis, Geometry and Trigonometry for Math)",
              "difficultyRating": "A number rating out of 10 matching the difficulty (e.g., 3/10 for easy, 6/10 for medium, 9/10 for hard)",
              "question": "The complete prompt passage or math problem text",
              "options": {
                "A": "First choice text",
                "B": "Second choice text",
                "C": "Third choice text",
                "D": "Fourth choice text"
              },
              "correctOption": "A, B, C, or D",
              "explanation": "Detailed step-by-step breakdown explaining why the correct answer is right and why others are incorrect."
            }`;

            // Automatic fallback list to bypass 503 traffic spikes
            const modelsToTry = ['gemini-3.8-flash', 'gemini-3.5-flash', 'gemini-2.5-flash'];
            let response = null;
            let lastError = null;

            for (const model of modelsToTry) {
                try {
                    response = await fetchWithModel(model, apiKey, prompt);
                    if (response.ok) {
                        break; // Success! Exit loop
                    } else {
                        const errText = await response.text();
                        lastError = `Model ${model} status ${response.status}: ${errText}`;
                    }
                } catch (err) {
                    lastError = err.name === 'AbortError' ? `Request timed out on ${model}` : err.message;
                }
            }

            try {
                if (!response || !response.ok) {
                    throw new Error(lastError || "All models are currently busy. Please try again in a moment.");
                }

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) {
                    throw new Error("No JSON found in response: " + rawText);
                }
                
                currentQuestionData = JSON.parse(jsonMatch[0]);

                renderQuestion();
                switchScreen('questionScreen');
            } catch (err) {
                console.error(err);
                alert('Notice: ' + err.message);
                switchScreen('introScreen');
            }
        }

        function renderQuestion() {
            document.getElementById('topicTag').innerText = currentQuestionData.topic;
            document.getElementById('difficultyBadge').innerText = `Difficulty: ${currentQuestionData.difficultyRating}`;
            document.getElementById('questionText').innerText = currentQuestionData.question;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            for (const [key, val] of Object.entries(currentQuestionData.options)) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.key = key;
                btn.innerText = `${key}) ${val}`;
                btn.onclick = () => handleAnswer(key, btn);
                optionsList.appendChild(btn);
            }

            const feedback = document.getElementById('feedbackBox');
            feedback.className = 'feedback-box';
            feedback.innerText = '';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleAnswer(selectedKey, btnElement) {
            const feedback = document.getElementById('feedbackBox');
            
            if (selectedKey === currentQuestionData.correctOption) {
                btnElement.classList.add('correct');
                feedback.className = 'feedback-box show success-msg';
                feedback.innerHTML = `<strong>Correct!</strong><br>${currentQuestionData.explanation}`;
                
                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                document.getElementById('nextBtn').style.display = 'inline-block';
            } else {
                btnElement.classList.add('incorrect');
                btnElement.disabled = true;
                feedback.className = 'feedback-box show error-msg';
                feedback.innerHTML = `Incorrect – Try again!`;
            }
        }
    </script>
</body>
</html>
