<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Question Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #a855f7;
            --bg: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --success: #10b981;
            --error: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .api-config {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        input[type="password"], select {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.55rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="password"]:focus, select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Intro Screen */
        .hero {
            text-align: center;
            padding: 1.5rem 0;
        }

        .hero h2 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.03em;
            color: #ffffff;
        }

        .hero p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .config-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .config-group select {
            width: 100%;
            padding: 0.85rem;
            font-size: 0.95rem;
        }

        .start-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.05rem;
            border-radius: 12px;
        }

        /* Question Screen */
        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 0.3rem 0.85rem;
            border-radius: 30px;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .question-text {
            font-size: 1.125rem;
            line-height: 1.7;
            margin-bottom: 1.75rem;
            white-space: pre-wrap;
            color: #f1f5f9;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }

        .option-btn {
            background: rgba(3, 7, 18, 0.5);
            border: 1px solid var(--border);
            color: var(--text);
            text-align: left;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--border-focus);
            background: rgba(99, 102, 241, 0.08);
            transform: translateX(4px);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
            color: #34d399 !important;
        }

        .option-btn.incorrect {
            background: rgba(244, 63, 94, 0.15) !important;
            border-color: var(--error) !important;
            color: #fb7185 !important;
        }

        .feedback-box {
            margin-top: 1.25rem;
            padding: 1.25rem;
            border-radius: 12px;
            display: none;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .feedback-box.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .feedback-box.error-msg {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
        }

        .feedback-box.success-msg {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .next-btn-container {
            margin-top: 1.75rem;
            text-align: right;
        }

        .loader {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.1rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SAT Question Generator</h1>
            <div class="api-config">
                <input type="password" id="apiKeyInput" placeholder="Gemini API Key">
                <button onclick="saveApiKey()">Save</button>
            </div>
        </header>

        <!-- SCREEN 1: INTRO / CONFIG -->
        <div id="introScreen" class="screen active">
            <div class="hero">
                <h2>Master the Digital SAT</h2>
                <p>Generate highly rigorous, official-standard adaptive practice questions powered by Google Gemini AI.</p>
                
                <div class="config-grid">
                    <div class="config-group">
                        <label for="domainSelect">Subject Domain</label>
                        <select id="domainSelect">
                            <option value="Reading & Writing">Reading & Writing</option>
                            <option value="Math">Math</option>
                        </select>
                    </div>
                    <div class="config-group">
                        <label for="difficultySelect">Target Difficulty</label>
                        <select id="difficultySelect">
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                </div>

                <button class="start-btn" onclick="startPractice()">Generate Practice Question</button>
            </div>
        </div>

        <!-- SCREEN 2: LOADING -->
        <div id="loadingScreen" class="screen">
            <div class="loader">
                <div class="spinner"></div>
                Crafting custom College Board standard question... Please wait.
            </div>
        </div>

        <!-- SCREEN 3: QUESTION VIEW -->
        <div id="questionScreen" class="screen">
            <div class="meta-bar">
                <span id="topicTag" class="badge">Topic</span>
                <span id="difficultyBadge">Difficulty: --/10</span>
            </div>

            <div id="questionText" class="question-text">Loading question text...</div>

            <div id="optionsList" class="options-list">
                <!-- Options injected via JS -->
            </div>

            <div id="feedbackBox" class="feedback-box"></div>

            <div class="next-btn-container">
                <button id="nextBtn" style="display:none;" onclick="startPractice()">Next Question &rarr;</button>
            </div>
        </div>
    </div>

    <script>
        let currentQuestionData = null;

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key saved successfully!');
            } else {
                alert('Please enter a valid key.');
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function fetchWithModel(modelName, apiKey, prompt) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: controller.signal,
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                clearTimeout(timeoutId);
                return response;
            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        async function startPractice() {
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('Please enter and save your Google Gemini API key first!');
                return;
            }

            const domain = document.getElementById('domainSelect').value;
            const difficulty = document.getElementById('difficultySelect').value;

            switchScreen('loadingScreen');

            const prompt = `You are an expert test creator for the College Board Digital SAT. Generate a single, highly rigorous ${difficulty} level multiple-choice question for ${domain}.
            
            Return ONLY a raw JSON object with no markdown wrappers, no backticks, matching this exact structure:
            {
              "topic": "Use official SAT taxonomy (e.g., Information and Ideas, Craft and Structure, Standard English Conventions for English; or Algebra, Advanced Math, Problem-Solving and Data Analysis, Geometry and Trigonometry for Math)",
              "difficultyRating": "A number rating out of 10 matching the difficulty (e.g., 3/10 for easy, 6/10 for medium, 9/10 for hard)",
              "question": "The complete prompt passage or math problem text",
              "options": {
                "A": "First choice text",
                "B": "Second choice text",
                "C": "Third choice text",
                "D": "Fourth choice text"
              },
              "correctOption": "A, B, C, or D",
              "explanation": "Detailed step-by-step breakdown explaining why the correct answer is right and why others are incorrect."
            }`;

            const modelsToTry = ['gemini-3.8-flash', 'gemini-3.5-flash', 'gemini-2.5-flash'];
            let response = null;
            let lastError = null;

            for (const model of modelsToTry) {
                try {
                    response = await fetchWithModel(model, apiKey, prompt);
                    if (response.ok) {
                        break; 
                    } else {
                        const errText = await response.text();
                        lastError = `Model ${model} status ${response.status}: ${errText}`;
                    }
                } catch (err) {
                    lastError = err.name === 'AbortError' ? `Request timed out on ${model}` : err.message;
                }
            }

            try {
                if (!response || !response.ok) {
                    throw new Error(lastError || "All models are currently busy. Please try again in a moment.");
                }

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) {
                    throw new Error("No JSON found in response: " + rawText);
                }
                
                currentQuestionData = JSON.parse(jsonMatch[0]);

                renderQuestion();
                switchScreen('questionScreen');
            } catch (err) {
                console.error(err);
                alert('Notice: ' + err.message);
                switchScreen('introScreen');
            }
        }

        function renderQuestion() {
            document.getElementById('topicTag').innerText = currentQuestionData.topic;
            document.getElementById('difficultyBadge').innerText = `Difficulty: ${currentQuestionData.difficultyRating}`;
            document.getElementById('questionText').innerText = currentQuestionData.question;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            for (const [key, val] of Object.entries(currentQuestionData.options)) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.key = key;
                btn.innerText = `${key}) ${val}`;
                btn.onclick = () => handleAnswer(key, btn);
                optionsList.appendChild(btn);
            }

            const feedback = document.getElementById('feedbackBox');
            feedback.className = 'feedback-box';
            feedback.innerText = '';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function handleAnswer(selectedKey, btnElement) {
            const feedback = document.getElementById('feedbackBox');
            
            if (selectedKey === currentQuestionData.correctOption) {
                btnElement.classList.add('correct');
                feedback.className = 'feedback-box show success-msg';
                feedback.innerHTML = `<strong>Correct!</strong><br>${currentQuestionData.explanation}`;
                
                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                document.getElementById('nextBtn').style.display = 'inline-block';
            } else {
                btnElement.classList.add('incorrect');
                btnElement.disabled = true;
                feedback.className = 'feedback-box show error-msg';
                feedback.innerHTML = `Incorrect – Try again!`;
            }
        }
    </script>
</body>
</html>
